<!doctype html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Ad Generator</title>
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>

<header class="top-bar">
    <div class="logo">AdTool</div>

    <div>
        <a href="dashboard.html" class="back-link">Dashboard</a>
        <a href="index.html" class="back-link">← Tilbage</a>
    </div>
</header>

<h1>Ad Generator</h1>

<section class="ad-form">
    <h2>Input</h2>
    <form id="adForm">
        <label>
            Brandnavn:
            <input id="brandInput" type="text" value="Marmalade Co.">
        </label>

        <label>
            Overskrift:
            <textarea id="headlineInput">LAGERSALG PÅ
UDVALGTE
PRODUKTER</textarea>
        </label>

        <label>
            Undertekst:
            <input id="sublineInput" type="text" value="Kun i dag!!">
        </label>

        <label>
            Rabat-tekst:
            <input id="discountInput" type="text" value="60% rabat">
        </label>

        <label>
            Modeltekst:
            <input id="sizeInfoInput" type="text" value="Modellen er 172 cm og bærer str. S">
        </label>

        <label>
            Trustpilot-tekst:
            <input id="trustInput" type="text" value="4,8 stjerner på Trustpilot">
        </label>

        <button type="button" id="generateImageBtn">
            Generér billede med AI
        </button>
    </form>
</section>

<section class="ad-preview">
    <h2>AI Preview</h2>

    <img id="aiImage"
         alt="AI-genereret annonce"
         style="max-width: 100%; height: auto; border-radius: 8px; display: none;">

    <button type="button"
            class="cta-btn"
            id="saveAdBtn"
            style="display: none; margin-top: 16px;">
        Gem annonce
    </button>
</section>

<script src="./js/script.js" defer></script>
</body>
</html>
